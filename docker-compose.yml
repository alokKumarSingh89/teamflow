services:
  postgres:
    image: postgres:17
    container_name: teamflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: postgres
    ports:
      - '5434:5432'
    volumes:
      - teamflow_postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:8
    container_name: teamflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - teamflow_redis_data:/data

volumes:
  teamflow_postgres_data:
  teamflow_redis_data:
